plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        "ic2reborn" {
            sourceSet sourceSets.main
        }
        "craftenergy" {
            sourceSet "main", ":craft-energy"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Biblioteca de energia CW/MV/RA, empacotada dentro do jar do IC2 Reborn
    implementation project(':craft-energy')
    include project(':craft-energy')
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
    it.options.compilerArgs << '-Xlint:deprecation'
}

java {
    // Minecraft 26.x ships Java 25
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Testes no mundo (src/gametest): rodam num servidor de teste durante o build e não entram no jar
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "ic2reborn-test"
        enableGameTests = true
        enableClientGameTests = false
    }
}
